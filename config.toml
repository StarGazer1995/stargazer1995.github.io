baseURL = "https://stargazer1995.github.io/"
title = "StarGazer"
theme = "PaperMod"

languageCode = "en"
defaultContentLanguage = "en"
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
copyright = "StarGazer"
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 12

[author]
  name = "StarGazer"
  email = "zhao.gong@outlook.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "tech"
    name = "Tech"
    url = "/tech/"
    weight = 2
  [[menu.main]]
    identifier = "travel"
    name = "Travel"
    url = "/travel/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4

[params]
  env = "production"
  title = "StarGazer"
  description = "Software engineer building systems for the physical world, deep-sky imaging, and the tools between them."
  keywords = ["autonomous driving", "astrophotography", "PixInsight", "deep sky", "AI assistants"]
  DateFormat = "2006-01-02"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  ShowBreadCrumbs = false
  ShowPostNavLinks = true
  ShowWordCount = false
  hideFooter = false
  mainSections = ["tech", "posts"]

  [params.assets]
    favicon = "/favicon-32x32.png"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = ":contentbasename"

[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
