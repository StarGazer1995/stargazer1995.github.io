trips:
  - slug: puer
    title: 普洱 · 景迈山
    subtitle: 茶山、咖啡和两个拍星夜
    start: "2026-09-29"
    end: "2026-10-05"
    days: 7
    type: 自驾
    status: 计划中
    region: 云南
    summary: 从普洱市区一路开到景迈山，白天逛古茶园和咖啡庄园，夜里在芒景拍星。
    center: [22.2, 100.8]
    zoom: 8
    route:
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
      - { name: 普洱, lat: 22.8252, lon: 100.9665, kind: drive }
      - { name: 太阳河, lat: 22.6167, lon: 101.0833, kind: drive }
      - { name: 那柯里, lat: 23.0167, lon: 101.0333, kind: drive }
      - { name: 景迈山, lat: 22.15, lon: 100.05, kind: star }
      - { name: 芒景, lat: 22.1667, lon: 100.0167, kind: stay }
      - { name: 澜沧, lat: 22.5556, lon: 99.9333, kind: flight }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
    highlights:
      - 景迈山古茶园
      - 芒景拍星夜
      - 新寨咖啡庄园
      - 那柯里茶马古道
    story:
      - "这趟的核心不是赶景点，而是把景迈山的三个晚上留给天空。满月在 9/26，9/29–10/1 月光偏亮，所以把进山放到 10/2，把三个晚上放在 10/2–10/4；10/2 上半夜无月约 5 小时，10/3、10/4 也都是上半夜可用。"
      - "白天走三条线：普洱市区的太阳河、那柯里茶马古道，景迈山的古茶园和翁基/糯岗村寨，以及小凹子/爱伲咖啡庄园。景迈山海拔 1400–1600 米，10 月白天 18–28°C，夜里 12–18°C，露水大，赤道仪和镜筒要带除雾带。"
      - "路线是普洱取车 → 太阳河 → 那柯里 → 景迈山（芒景/芒洪住三晚）→ 澜沧还车/飞昆明。最后约 20 公里盘山路，夜里下山慢行；租车要确认普洱取车、澜沧异地还车。"
      - "还没出发，所以这里先把计划、月相和路线放好；等真正走完，再把实拍和现场感受补进来。"
    gallery:
      - { src: "/images/travel/puer/route.jpg", alt: "普洱路线图", caption: "计划路线：普洱 → 景迈山 → 澜沧" }
    photo_note: "还没出发，先放计划路线图；实拍等回来补。"
    itinerary:
      - date: 2026-09-29
        title: 上海 → 普洱
        items:
          - 东航 MU5812 直飞，落地后入住市区
          - 机场或次日早上取车，先适应节奏
      - date: 2026-09-30
        title: 太阳河国家森林公园
        items:
          - 犀牛坪景区，小熊猫和犀牛
          - 工作日几乎包场，晚上回市区早睡
      - date: 2026-10-01
        title: 那柯里 + 咖啡庄园
        items:
          - 那柯里茶马古道驿站，风雨桥和石板路
          - 下午小凹子 / 爱伲咖啡庄园，手冲和日落
          - 晚上整理器材，准备进山
      - date: 2026-10-02
        title: 进山 + 半夜调试
        items:
          - 普洱 → 澜沧 → 惠民 → 景迈山，约 2.5–3 小时
          - 途经老达保和糯岗古寨
          - 月出约 00:10，上半夜调试赤道仪
      - date: 2026-10-03
        title: 古茶园 + 主拍夜①
        items:
          - 清晨看云海，上午大平掌古茶园徒步
          - 下午翁基古寨烤茶
          - 夜里主拍，月出约 01:00
      - date: 2026-10-04
        title: 芒景 + 主拍夜②
        items:
          - 蜂王树、芒景村，下午午睡
          - 夜里第二场主拍，月出约 01:50
      - date: 2026-10-05
        title: 景迈山 → 昆明 → 上海
        items:
          - 06:00 下山，澜沧或普洱还车
          - 昆明转机回上海，避开返程高峰

  - slug: dianxi
    title: 滇西行 · 昆明 · 弥勒 · 保山 · 芒市
    subtitle: 一场婚礼，一条咖啡产地线
    start: "2026-09-25"
    end: "2026-10-04"
    days: 10
    type: 公共交通
    status: 已去
    region: 云南
    summary: 昆明落地，去泸西参加婚礼，再沿保山、潞江坝、芒市走一圈；全程城际铁路、班车和打车。
    center: [25.2, 99.2]
    zoom: 7
    route:
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: train }
      - { name: 弥勒, lat: 24.414, lon: 103.442, kind: train }
      - { name: 泸西, lat: 24.533, lon: 103.766, kind: drive }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: train }
      - { name: 保山, lat: 25.112, lon: 99.161, kind: train }
      - { name: 潞江坝, lat: 25.0, lon: 98.85, kind: drive }
      - { name: 芒市, lat: 24.433, lon: 98.585, kind: drive }
      - { name: 保山, lat: 25.112, lon: 99.161, kind: train }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
    highlights:
      - 泸西婚礼
      - 潞江坝小粒咖啡
      - 芒市金银塔
      - 保山城区慢逛
    story:
      - "这趟的起点是泸西的婚礼，不是某个景区。9/25 昆明落地，先去建新园吃一碗过桥米线，再逛昆明老街/南强街；9/26 动车到弥勒，再包车去泸西，下午在婷哥家收拾婚房。"
      - "9/27 全天婚礼；9/28 回昆明，翠湖、云大、讲武堂一带慢慢走。9/29 坐 C352 到保山，再班车去潞江坝，比顿庄园，晚上金瓢牛肉——从这天开始，主线变成小粒咖啡。"
      - "保山住了 4 晚，但没有把城区塞满：八戒庙、卧佛寺、永子棋院都很小，半天到一天足够；真正撑起行程的是郊线。9/30 去芒市一日，树包塔、菩提寺、五云寺、珍奇园、雷牙让山银塔和书店，18:00 回保山。"
      - "10/1 在保山城区，希音咖啡的冷萃不错；10/2 去坝湾的新寨咖啡庄园，铁皮卡平和、瑰夏明亮，晚上乡野土菜偏重口。10/3 回昆明，大观楼和海埂大坝日落；10/4 省博和官渡古镇，17:00 飞上海。"
      - "复盘：全程无自驾，城际铁路 + 县际班车 + 打车完全够用；保山城区的点体量小，下次把时间留给腾冲/潞江坝；山珍苑的野生菌火锅是季节限定，明年 9–10 月再补。"
    gallery:
      - { src: "/images/travel/dianxi/route.jpg", alt: "滇西路线图", caption: "路线示意：昆明 → 弥勒/泸西 → 保山 → 潞江坝/芒市 → 昆明" }
    photo_note: "滇西的实拍还没从手机/NAS 导出；先放路线图，照片补上后我再替换。"
    itinerary:
      - date: 2026-09-25
        title: 昆明落地
        items:
          - 建新园过桥米线
          - 昆明老街、南强街
      - date: 2026-09-26
        title: 昆明 → 弥勒 → 泸西
        items:
          - 动车到弥勒，再包车去泸西
          - 到婷哥家帮忙收拾婚房
      - date: 2026-09-27
        title: 泸西婚礼
        items:
          - 全天婚礼，跟雨晨一起张罗
      - date: 2026-09-28
        title: 弥勒 → 昆明
        items:
          - 翠湖、云大、讲武堂一带
          - 回昆明住一晚
      - date: 2026-09-29
        title: 昆明 → 保山 → 潞江坝
        items:
          - C352 昆明 08:43 → 保山 12:46
          - 班车到坝湾，比顿庄园
          - 晚饭金瓢牛肉
      - date: 2026-09-30
        title: 芒市一日
        items:
          - 树包塔、菩提寺、五云寺
          - 珍奇园、雷牙让山银塔和书店
          - 18:00 返回保山
      - date: 2026-10-01
        title: 保山城区
        items:
          - 八戒庙、卧佛寺、永子棋院
          - 希音咖啡冷萃
      - date: 2026-10-02
        title: 潞江坝咖啡日
        items:
          - 保山南 → 坝湾 → 新寨咖啡庄园
          - 铁皮卡和瑰夏
          - 晚饭乡野土菜
      - date: 2026-10-03
        title: 保山 → 昆明
        items:
          - C342 保山 08:57 → 昆明 13:09
          - 大观楼、海埂大坝日落
      - date: 2026-10-04
        title: 昆明收尾 → 上海
        items:
          - 云南省博物馆、官渡古镇
          - 17:00 飞上海

  - slug: osaka
    title: 大阪 · 京都
    subtitle: 环球影城和京都红叶
    start: "2026-11-20"
    end: "2026-11-23"
    days: 4
    type: 境外
    status: 计划中
    region: 日本
    summary: 三连休加京都红叶主峰，大阪住三晚，一天环球影城，一天京都东山，一天岚山。
    center: [34.85, 135.6]
    zoom: 9
    route:
      - { name: 关西机场, lat: 34.4347, lon: 135.244, kind: flight }
      - { name: 大阪 · 梅田, lat: 34.7147, lon: 135.507, kind: stay }
      - { name: 大阪城, lat: 34.6873, lon: 135.5262, kind: drive }
      - { name: 环球影城, lat: 34.6654, lon: 135.4323, kind: drive }
      - { name: 京都, lat: 35.0116, lon: 135.7681, kind: train }
      - { name: 关西机场, lat: 34.4347, lon: 135.244, kind: flight }
    highlights:
      - 环球影城
      - 京都东山红叶
      - 大阪城
      - 岚山竹林
    story:
      - "三连休加京都红叶主峰：11/21 周六、11/22 周日、11/23 周一是日本的三连休；清水寺、东福寺、岚山都在峰值人流，USJ 周六也接近全年峰值。"
      - "住梅田 SEIHA，到 USJ 单程 28 分钟、到京都 45 分钟、到关西机场 75 分钟；比原来的 Moxy 远一点，但三晚便宜约 ¥2,600。16:00 才能入住、没有前台，D1 和 D4 都要先解决行李。"
      - "D1 机场 → 大阪城 → 梅田夜景；D2 环球影城一整天；D3 京都东山红叶线（稻荷 → 东福寺 → 清水寺 → 祇园 → 永观堂）；D4 退房 → 岚山 → 回大阪取行李 → 关西机场。"
      - "还没出发，实拍等回来补；先把路线、交通和每天的骨架放好。"
    gallery:
      - { src: "/images/travel/osaka/route.jpg", alt: "大阪京都路线图", caption: "计划路线：关西机场 → 大阪 → 京都 → 关西机场" }
    photo_note: "还没出发，先放计划路线图。"
    itinerary:
      - date: 2026-11-20
        title: 关西机场 → 大阪
        items:
          - 入住梅田 SEIHA，先存行李
          - 大阪城，梅田夜景
      - date: 2026-11-21
        title: 环球影城
        items:
          - 全天 USJ，Express Pass 提前买
      - date: 2026-11-22
        title: 京都东山红叶线
        items:
          - 京都站 → 稻荷 → 东福寺
          - 清水寺 → 祇园 → 永观堂
      - date: 2026-11-23
        title: 岚山 → 关西机场
        items:
          - 退房，行李寄存在天神桥筋六丁目
          - 嵯峨岚山 → 渡月桥 → 竹林 → 常寂光寺
          - 回大阪取行李，去关西机场

  - slug: zhedong
    title: 浙东大环线
    subtitle: 绍兴、台州海岸、天台山、横店与义乌
    start: ""
    end: ""
    days: 4
    type: 自驾
    status: 已去
    region: 浙江
    summary: 原计划 5 天，实际走成 4 天 3 晚：绍兴、宁波、台州沿海一号线、天台山、横店和义乌。
    center: [29.6, 120.8]
    zoom: 7
    route:
      - { name: 杭州, lat: 30.2741, lon: 120.1551, kind: drive }
      - { name: 绍兴, lat: 30.0303, lon: 120.5802, kind: drive }
      - { name: 宁波, lat: 29.8683, lon: 121.544, kind: stay }
      - { name: 台州, lat: 28.6564, lon: 121.4208, kind: drive }
      - { name: 天台山, lat: 29.1931, lon: 121.0067, kind: stay }
      - { name: 横店, lat: 29.15, lon: 120.32, kind: drive }
      - { name: 义乌, lat: 29.3069, lon: 120.075, kind: stay }
      - { name: 杭州, lat: 30.2741, lon: 120.1551, kind: drive }
    highlights:
      - 横店土菜馆鸡汤
      - 台州沿海一号线
      - 天台山国清寺 / 石梁飞瀑
      - 义乌三挺路夜市
    story:
      - "原计划是 5 天：杭州 → 绍兴 → 天台山 → 神仙居 → 松阳 → 杭州。实际走成 4 天 3 晚、约 600 公里，砍掉了神仙居和松阳，临时加了宁波、台州沿海一号线、横店和义乌。"
      - "Day1 杭州到绍兴，鲁迅故里、沈园、仓桥直街；绍兴没住，傍晚直接到宁波过夜，给第二天去台州缩短路程。"
      - "Day2 宁波到台州，傍晚走沿海一号线，海岸线日落是这趟最好的风景。Day3 天台山爬山看石梁飞瀑、国清寺，下午去横店，土菜馆的鸡汤是全程最大惊喜，晚上义乌三挺路夜市。"
      - "Day4 逛义乌国际商贸城，下午回杭州。四天里最喜欢的四件事：横店土菜馆鸡汤、台州沿海一号线日落、天台山登山观瀑、义乌三挺路夜市；商贸城适合扫街，不适合赶时间。"
    gallery:
      - { src: "/images/travel/zhedong/route.jpg", alt: "浙东路线图", caption: "实际路线：杭州 → 绍兴 → 宁波 → 台州 → 天台山 → 横店 → 义乌 → 杭州" }
    photo_note: "浙东的实拍还在手机里，NAS 活动目录里没有对应文件夹；先放路线图。"
    itinerary:
      - date: "Day 1"
        title: 杭州 → 绍兴 → 宁波
        items:
          - 绍兴鲁迅故里、沈园、仓桥直街
          - 傍晚驱车到宁波住宿，给第二天去台州缩短路程
      - date: "Day 2"
        title: 宁波 → 台州 → 沿海一号线
        items:
          - 中午到台州，傍晚走沿海一号线
          - 海岸线日落是这趟的最佳风景
      - date: "Day 3"
        title: 天台山 → 横店 → 义乌
        items:
          - 天台山爬山看石梁飞瀑，国清寺
          - 横店土菜馆鸡汤
          - 义乌三挺路夜市
      - date: "Day 4"
        title: 义乌商贸城 → 杭州
        items:
          - 逛义乌国际商贸城
          - 下午开车回杭州

  - slug: ganxi
    title: 甘西大环线
    subtitle: 河西走廊到柴达木、青海湖
    start: "2025-04-30"
    end: "2025-05-04"
    days: 5
    type: 自驾
    status: 已去
    region: 甘肃 / 青海
    summary: 兰州出发，沿河西走廊到敦煌，再翻到柴达木和青海湖；路线骨架先放上来，逐日行程待补。
    note: 路线骨架和主要停靠点已经确定，逐日行程、住宿和门票还在整理。
    center: [38.2, 98.5]
    zoom: 6
    route:
      - { name: 兰州, lat: 36.0611, lon: 103.8343, kind: drive }
      - { name: 武威, lat: 37.9283, lon: 102.638, kind: drive }
      - { name: 张掖, lat: 38.9259, lon: 100.4498, kind: stay }
      - { name: 嘉峪关, lat: 39.772, lon: 98.2891, kind: drive }
      - { name: 敦煌, lat: 40.1421, lon: 94.6619, kind: stay }
      - { name: 东台吉乃尔湖, lat: 37.6119, lon: 93.7639, kind: star }
      - { name: 大柴旦, lat: 37.85, lon: 95.35, kind: drive }
      - { name: 茶卡, lat: 36.78, lon: 99.08, kind: stay }
      - { name: 青海湖, lat: 36.9, lon: 100.2, kind: star }
      - { name: 西宁, lat: 36.6171, lon: 101.7782, kind: flight }
    highlights:
      - 莫高窟
      - 张掖丹霞
      - 大柴旦翡翠湖
      - 青海湖
    story:
      - "2025 五一从兰州出发，沿河西走廊到敦煌，再翻到柴达木和青海湖。八天路线骨架：兰州 → 武威 → 张掖 → 嘉峪关 → 敦煌 → 大柴旦 → 茶卡 → 青海湖 → 西宁。"
      - "这条线的尺度很大：嘉峪关的城墙、平山湖大峡谷的沟壑、张掖丹霞的色带、敦煌的沙和窟、大柴旦翡翠湖的盐池，都是一段一段换地貌。"
      - "照片主要来自 DJI Mini 的航拍：嘉峪关从空中看是一个完整的方形城，翡翠湖的绿色和蓝色像调色盘，湖心岛像一块漂在水里的盐壳。"
      - "逐日行程、住宿和门票还在整理；先把路线和照片放上来，下一次再补每天的细节和驾驶强度。"
