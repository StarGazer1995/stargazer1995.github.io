      - { src: "/images/travel/ganxi/lanzhou-zhongshan-bridge.jpg", alt: "兰州中山桥", caption: "傍晚回到兰州，中山桥上挂满红灯笼，桥下是黄河。", day: "2025-05-04", place: "兰州", pos: "center 45%" }
      - { src: "/images/travel/ganxi/lanzhou-white-pagoda.jpg", alt: "白塔山上的绿瓦建筑", caption: "白塔山上的绿瓦建筑，从山脚一路爬上去能俯瞰兰州。", day: "2025-05-04", place: "兰州" }
      - { src: "/images/travel/ganxi/lanzhou-gansu-museum.jpg", alt: "甘肃博物院", caption: "最后一站甘肃博物院，门口的金色长颈鹿很显眼。", day: "2025-05-04", place: "兰州" }
      - { src: "/images/travel/ganxi/flight-window.jpg", alt: "从兰州飞回上海的舷窗", caption: "5 月 5 日从兰州飞回上海。舷窗外先是黄土高原的山脊，往东山越来越低，最后变成华北平原，能看出第二阶梯到第三阶梯的变化。", day: "2025-05-05", pos: "center 40%" }
      - { src: "/images/travel/ganxi/route.jpg", alt: "甘青大环线路线图", caption: "路线示意：兰州 → 河西走廊 → 敦煌 → 柴达木 → 青海湖 → 西宁 → 兰州。" }
    photo_note: "照片来自 2025-04-30～05-05 这趟的 iPhone 与无人机原片；无人机片有 EXIF GPS，手机片只按拍摄日归档，不硬标点位。"
    itinerary:
      - date: "2025-04-30"
        title: 兰州 → 张掖
        items:
          - 兰州取车出发，沿河西走廊往张掖
          - 下午进平山湖大峡谷，走栈道看红色岩壁
          - 晚上住张掖
      - date: "2025-05-01"
        title: 张掖 → 嘉峪关 → 敦煌
        items:
          - 嘉峪关悬壁长城 / 关城
          - 傍晚鸣沙山月牙泉骑骆驼
          - 晚上沙洲夜市，住敦煌
      - date: "2025-05-02"
        title: 敦煌 → 大柴旦
        items:
          - 上午莫高窟，提前看敦煌博物馆补背景
          - 下午往柴达木开，路过黑独山，黑色碎石坡一直铺到远处
          - 晚上在冷湖吃晚饭（不太好吃），饭后赶到大柴旦住宿
      - date: "2025-05-03"
        title: 大柴旦 → 乌素特 → 德令哈
        items:
          - 大柴旦翡翠湖，主要用无人机航拍
          - 乌素特（水上）雅丹，无人机飞进去看
          - 傍晚往德令哈开
      - date: "2025-05-04"
        title: 青海湖 → 兰州（直接开回）
        items:
          - 青海湖边木栈道
          - 傍晚回兰州，中山桥和白塔山
          - 甘肃博物院收尾，住兰州
      - date: "2025-05-05"
        title: 兰州 → 上海
        items:
          - 从兰州飞回上海
          - 舷窗外看黄土高原到华北平原的阶梯变化

