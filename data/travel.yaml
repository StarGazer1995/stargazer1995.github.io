  - slug: ganxi
    title: 甘青大环线
    subtitle: 河西走廊到柴达木、青海湖
    start: "2025-04-30"
    end: "2025-05-05"
    days: 6
    type: 自驾
    status: 已去
    region: 甘肃 / 青海
    summary: 兰州出发，沿河西走廊到敦煌，再翻到柴达木和青海湖，最后回兰州；六天换了几种完全不同的地貌。
    note: 逐日行程按照片拍摄时间和路线整理；个别停靠顺序记不清的地方标了“不确定”。
    center: [38.2, 98.5]
    zoom: 6
    route:
      - { name: 兰州, lat: 36.0611, lon: 103.8343, kind: drive }
      - { name: 武威, lat: 37.9283, lon: 102.638, kind: drive }
      - { name: 张掖, lat: 38.9259, lon: 100.4498, kind: stay }
      - { name: 嘉峪关, lat: 39.772, lon: 98.2891, kind: drive }
      - { name: 敦煌, lat: 40.1421, lon: 94.6619, kind: stay }
      - { name: 冷湖, lat: 38.75, lon: 93.34, kind: drive }
      - { name: 乌素特（水上）雅丹, lat: 37.6119, lon: 93.7639, kind: star }
      - { name: 大柴旦, lat: 37.85, lon: 95.35, kind: drive }
      - { name: 德令哈, lat: 37.369, lon: 97.37, kind: drive }
      - { name: 青海湖, lat: 36.9, lon: 100.2, kind: star }
      - { name: 兰州, lat: 36.0611, lon: 103.8343, kind: flight }
    highlights:
      - 莫高窟
      - 张掖丹霞
      - 大柴旦翡翠湖
      - 乌素特（水上）雅丹
      - 青海湖
    story:
      - "2025 五一从兰州取车出发，原计划走到西宁就结束，实际最后又直接开回了兰州，5 月 5 日才飞回上海。六天时间，路线像一个大圈：河西走廊、敦煌、柴达木、青海湖，最后回到黄河边。"
      - "4 月 30 日一早从兰州往张掖开。下午进平山湖大峡谷，红色岩壁一层压着一层，栈道贴着山脊走，风大得帽子都按不住。走到螺旋楼梯那段，往上爬的时候不觉得，站到高处回头看，沟壑一直铺到天边。晚上在张掖吃了羊排、牛肉，还有酸奶；这绝对是我第一次真的知道，原来西北的牛羊肉和酸奶可以这么好吃。"
      - "5 月 1 日先到嘉峪关。悬壁长城修在山脊上，台阶又陡又窄，爬到一半腿就开始发酸；回头一看，城墙外面就是一大片灰黄色的戈壁。下午继续往敦煌赶，傍晚到鸣沙山骑骆驼。太阳快落的时候，沙脊上的影子拉得很长，骆驼队一队一队往上走。天黑后回市区逛沙洲夜市，白天那种空旷感一下子被人群和灯光填满。"
      - "5 月 2 日上午看莫高窟。洞窟里很暗，讲解员的手电筒照到哪里，壁画才亮到哪里；进洞前先去了敦煌博物馆，把河西走廊和莫高窟的来龙去脉补了一遍。下午往柴达木开，路过黑独山。那不是一座孤零零的山，是一大片黑色碎石坡铺到远处，走在上面像到了另一个星球。我们在冷湖吃的晚饭，真的不好吃……之后晚上赶路到了大柴旦住宿。"
      - "5 月 3 日只有两个点：大柴旦翡翠湖和乌素特（水上）雅丹。翡翠湖的湖水蓝绿得不真实，盐滩白得发亮，无人机升起来以后，水塘、栈道和盐结晶的边界看得清清楚楚。乌素特不用走进去，无人机飞进去看就够了：一片片土丘泡在绿色湖水里，风很大，站久了有点站不稳。傍晚往德令哈开，路边只剩电塔、戈壁和低矮的山，天慢慢暗下来，脑子里就冒出海子那句“姐姐，今夜我在德令哈”。"
      - "5 月 4 日从青海湖边直接开回兰州。湖面灰蒙蒙的，木栈道一直伸到水边，风把衣服吹得鼓起来。下午回到兰州，先去中山桥，桥上挂满红灯笼，桥下是浑黄的黄河；再上白塔山，最后去甘肃博物院收尾。几天前还在盐湖和戈壁里，突然回到城市，落差很大。"
      - "5 月 5 日从兰州飞回上海。舷窗外先是黄土高原的沟壑和山脊，往东飞，山慢慢变低，进入华北平原，能看出中国地势从第二阶梯降到第三阶梯。"
