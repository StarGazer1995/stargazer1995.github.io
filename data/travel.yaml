    highlights:
      - 横店土菜馆鸡汤
      - 台州沿海一号线
      - 天台山国清寺 / 石梁飞瀑
      - 义乌三挺路夜市
    story:
      - "原计划是 5 天：杭州 → 绍兴 → 天台山 → 神仙居 → 松阳 → 杭州。实际走成 4 天 3 晚、约 600 公里，砍掉了神仙居和松阳，临时加了宁波、台州沿海一号线、横店和义乌。"
      - "Day1 杭州到绍兴，鲁迅故里、沈园、仓桥直街；绍兴没住，傍晚直接到宁波过夜，给第二天去台州缩短路程。"
      - "Day2 宁波到台州，傍晚走沿海一号线，海岸线日落是这趟最好的风景。Day3 天台山爬山看石梁飞瀑、国清寺，下午去横店，土菜馆的鸡汤是全程最大惊喜，晚上义乌三挺路夜市。"
      - "Day4 逛义乌国际商贸城，下午回杭州。四天里最喜欢的四件事：横店土菜馆鸡汤、台州沿海一号线日落、天台山登山观瀑、义乌三挺路夜市；商贸城适合扫街，不适合赶时间。"
