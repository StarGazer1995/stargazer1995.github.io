trips:
  - slug: puer
    title: 普洱 · 景迈山
    subtitle: 茶山、咖啡和两个拍星夜
    start: "2026-09-29"
    end: "2026-10-05"
    days: 7
    type: 自驾
    status: 未成行
    region: 云南
    summary: 从普洱市区一路开到景迈山，白天逛古茶园和咖啡庄园，夜里在芒景拍星。
    center: [22.2, 100.8]
    zoom: 8
    route:
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
      - { name: 普洱, lat: 22.8252, lon: 100.9665, kind: drive }
      - { name: 太阳河, lat: 22.6167, lon: 101.0833, kind: drive }
      - { name: 那柯里, lat: 23.0167, lon: 101.0333, kind: drive }
      - { name: 景迈山, lat: 22.15, lon: 100.05, kind: star }
      - { name: 芒景, lat: 22.1667, lon: 100.0167, kind: stay }
      - { name: 澜沧, lat: 22.5556, lon: 99.9333, kind: flight }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
    highlights:
      - 景迈山古茶园
      - 芒景拍星夜
      - 新寨咖啡庄园
      - 那柯里茶马古道
    story:
      - "这趟的核心不是赶景点，而是把景迈山的三个晚上留给天空。满月在 9/26，9/29–10/1 月光偏亮，所以把进山放到 10/2，把三个晚上放在 10/2–10/4；10/2 上半夜无月约 5 小时，10/3、10/4 也都是上半夜可用。"
      - "白天走三条线：普洱市区的太阳河、那柯里茶马古道，景迈山的古茶园和翁基/糯岗村寨，以及小凹子/爱伲咖啡庄园。景迈山海拔 1400–1600 米，10 月白天 18–28°C，夜里 12–18°C，露水大，赤道仪和镜筒要带除雾带。"
      - "路线是普洱取车 → 太阳河 → 那柯里 → 景迈山（芒景/芒洪住三晚）→ 澜沧还车/飞昆明。最后约 20 公里盘山路，夜里下山慢行；租车要确认普洱取车、澜沧异地还车。"
      - "还没出发，所以这里先把计划、月相和路线放好；等真正走完，再把实拍和现场感受补进来。"
    gallery:
      - { src: "/images/travel/puer/route.jpg", alt: "普洱路线图", caption: "计划路线：普洱 → 景迈山 → 澜沧" }
    photo_note: "这趟最后没有成行；路线、月相和器材计划留在这里，当作以后重排的参考。"
    itinerary:
      - date: 2026-09-29
        title: 上海 → 普洱
        items:
          - 东航 MU5812 直飞，落地后入住市区
          - 机场或次日早上取车，先适应节奏
      - date: 2026-09-30
        title: 太阳河国家森林公园
        items:
          - 犀牛坪景区，小熊猫和犀牛
          - 工作日几乎包场，晚上回市区早睡
      - date: 2026-10-01
        title: 那柯里 + 咖啡庄园
        items:
          - 那柯里茶马古道驿站，风雨桥和石板路
          - 下午小凹子 / 爱伲咖啡庄园，手冲和日落
          - 晚上整理器材，准备进山
      - date: 2026-10-02
        title: 进山 + 半夜调试
        items:
          - 普洱 → 澜沧 → 惠民 → 景迈山，约 2.5–3 小时
          - 途经老达保和糯岗古寨
          - 月出约 00:10，上半夜调试赤道仪
      - date: 2026-10-03
        title: 古茶园 + 主拍夜①
        items:
          - 清晨看云海，上午大平掌古茶园徒步
          - 下午翁基古寨烤茶
          - 夜里主拍，月出约 01:00
      - date: 2026-10-04
        title: 芒景 + 主拍夜②
        items:
          - 蜂王树、芒景村，下午午睡
          - 夜里第二场主拍，月出约 01:50
      - date: 2026-10-05
        title: 景迈山 → 昆明 → 上海
        items:
          - 06:00 下山，澜沧或普洱还车
          - 昆明转机回上海，避开返程高峰

  - slug: dianxi
    title: 滇西行 · 昆明 · 弥勒 · 保山 · 芒市
    subtitle: 一场婚礼，一条咖啡产地线
    start: "2026-09-25"
    end: "2026-10-04"
    days: 10
    type: 公共交通
    status: 已去
    region: 云南
    summary: 昆明落地，去泸西参加婚礼，再沿保山、潞江坝、芒市走一圈；全程城际铁路、班车和打车。
    center: [25.2, 99.2]
    zoom: 7
    route:
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: train }
      - { name: 弥勒, lat: 24.414, lon: 103.442, kind: train }
      - { name: 泸西, lat: 24.533, lon: 103.766, kind: drive }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: train }
      - { name: 保山, lat: 25.112, lon: 99.161, kind: train }
      - { name: 潞江坝, lat: 25.0, lon: 98.85, kind: drive }
      - { name: 芒市, lat: 24.433, lon: 98.585, kind: drive }
      - { name: 保山, lat: 25.112, lon: 99.161, kind: train }
      - { name: 昆明, lat: 25.0389, lon: 102.7183, kind: flight }
    highlights:
      - 泸西婚礼
      - 潞江坝小粒咖啡
      - 芒市金银塔
      - 保山城区慢逛
    story:
      - "这趟的起点是泸西的婚礼，不是某个景区。9/25 昆明落地，先去建新园吃一碗过桥米线，再逛昆明老街/南强街；9/26 动车到弥勒，再包车去泸西，下午在婷哥家收拾婚房。"
      - "9/27 全天婚礼；9/28 回昆明，翠湖、云大、讲武堂一带慢慢走。9/29 坐 C352 到保山，再班车去潞江坝，比顿庄园，晚上金瓢牛肉——从这天开始，主线变成小粒咖啡。"
      - "保山住了 4 晚，但没有把城区塞满：八戒庙、卧佛寺、永子棋院都很小，半天到一天足够；真正撑起行程的是郊线。9/30 去芒市一日，树包塔、菩提寺、五云寺、珍奇园、雷牙让山银塔和书店，18:00 回保山。"
      - "10/1 在保山城区，希音咖啡的冷萃不错；10/2 去坝湾的新寨咖啡庄园，铁皮卡平和、瑰夏明亮，晚上乡野土菜偏重口。10/3 回昆明，大观楼和海埂大坝日落；10/4 省博和官渡古镇，17:00 飞上海。"
      - "复盘：全程无自驾，城际铁路 + 县际班车 + 打车完全够用；保山城区的点体量小，下次把时间留给腾冲/潞江坝；山珍苑的野生菌火锅是季节限定，明年 9–10 月再补。"
    gallery:
      - { src: "/images/travel/dianxi/kunming-laostreet.jpg", alt: "昆明老街一带的古玩城", caption: "9/25 下午落地昆明，老街一带的古玩城，牌楼和居民楼挤在一起。", day: "2026-09-25", place: "昆明" }
      - { src: "/images/travel/dianxi/guoqiao-mixian.jpg", alt: "建新园过桥米线", caption: "到昆明第一顿，建新园过桥米线，一碗汤配一托盘小碟。", day: "2026-09-25", place: "昆明" }
      - { src: "/images/travel/dianxi/kunming-signs.jpg", alt: "护国路与南强街的路牌", caption: "护国路、南强街的路牌，往右是吃的，往左也是吃的。", day: "2026-09-25", place: "昆明" }
      - { src: "/images/travel/dianxi/cuihu.jpg", alt: "昆明翠湖", caption: "9/28 的翠湖，水面被风吹皱，远处是昆明的楼。", day: "2026-09-28", place: "昆明" }
      - { src: "/images/travel/dianxi/yunda-qifeng.jpg", alt: "云南大学校园里的起凤坊", caption: "云大校园里的起凤坊，树荫把整条路罩住。", pos: "center 42%", day: "2026-09-28", place: "昆明" }
      - { src: "/images/travel/dianxi/jiangwutang.jpg", alt: "云南陆军讲武堂", caption: "云南陆军讲武堂，黄墙前面正好停了一辆出租车。", pos: "center 38%", day: "2026-09-28", place: "昆明" }
      - { src: "/images/travel/dianxi/coffee-manor.jpg", alt: "潞江坝比顿庄园的草坪", caption: "9/29 到潞江坝，比顿庄园的草坪，云压在山头上。", day: "2026-09-29", place: "潞江坝" }
      - { src: "/images/travel/dianxi/coffee-geisha.jpg", alt: "比顿庄园的云南瑰夏", caption: "比顿庄园的云南瑰夏，卡片上写着黄杏、果酱、咖啡花。", day: "2026-09-29", place: "潞江坝" }
      - { src: "/images/travel/dianxi/shubao-ta.jpg", alt: "芒市街边的老榕树", caption: "9/30 芒市街边的老榕树，气根一直垂到地面。", pos: "center 32%", day: "2026-09-30", place: "芒市" }
      - { src: "/images/travel/dianxi/puti-temple.jpg", alt: "芒市菩提寺门口", caption: "菩提寺门口，傣族大姐拎着花往里走，门楣上挂着黑底金字的匾。", day: "2026-09-30", place: "芒市" }
      - { src: "/images/travel/dianxi/mangshi-peacock.jpg", alt: "菩提寺院子里的孔雀", caption: "菩提寺院子里的孔雀，蹲在花盆边上，完全不怕人。", day: "2026-09-30", place: "芒市" }
      - { src: "/images/travel/dianxi/mangshi-white.jpg", alt: "芒市银塔群", caption: "金塔旁边的银塔群，白得有点晃眼。", day: "2026-09-30", place: "芒市" }
      - { src: "/images/travel/dianxi/mangshi-golden.jpg", alt: "芒市勐焕大金塔", caption: "雷牙让山上的勐焕大金塔，背后就是一整片山。", day: "2026-09-30", place: "芒市" }
      - { src: "/images/travel/dianxi/wofo-temple.jpg", alt: "保山卧佛寺", caption: "10/1 保山卧佛寺，池水把大殿整个翻了一遍。", day: "2026-10-01", place: "保山" }
      - { src: "/images/travel/dianxi/coffee-tree.jpg", alt: "咖啡树叶特写", caption: "庄园边上的咖啡树，叶子被雨洗得很干净。" }
      - { src: "/images/travel/dianxi/coffee-clouds.jpg", alt: "新寨村的山间云海", caption: "10/2 中午在新寨，云从山腰漫过来，整个村子只剩屋顶。", day: "2026-10-02", place: "潞江坝" }
      - { src: "/images/travel/dianxi/daguanlou.jpg", alt: "昆明大观楼", caption: "10/3 大观楼，柳枝挡在前面，楼下全是人。", day: "2026-10-03", place: "昆明" }
      - { src: "/images/travel/dianxi/kunming-lake.jpg", alt: "昆明滇池边的快艇", caption: "滇池边的快艇刚靠岸，湖对岸是西山。", day: "2026-10-03", place: "昆明" }
      - { src: "/images/travel/dianxi/lotus.jpg", alt: "昆明水面上的睡莲", caption: "水面上开着一朵睡莲，十月的昆明还没什么秋意。", day: "2026-10-03", place: "昆明" }
      - { src: "/images/travel/dianxi/dinosaur.jpg", alt: "云南省博物馆的云南地形模型", caption: "10/4 云南省博，大厅里一块立体的云南地形模型。", day: "2026-10-04", place: "昆明" }
      - { src: "/images/travel/dianxi/cloud-sea.jpg", alt: "返程航班上的云海", caption: "回上海的航班上，云层一直铺到天边。", day: "2026-10-04" }
    photo_note: "照片都从 iPhone 的「Photos」里导出，按拍摄时间排；这批原片没有 GPS 信息，所以只放画廊，没往地图上硬标点位，地图上的停靠点按行程城市标。"
